<!doctype html>
<!-- Source for public/social-card.png (1200x630 link-preview image). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=public/social-card.png scripts/social-card.html -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #202124; font-synthesis: none; -webkit-font-smoothing: antialiased; }
  /* Shown as small as ~280px wide (LinkedIn Featured), so keep text few and large. */
  .card { box-sizing: border-box; height: 630px; padding: 0 96px; display: flex; flex-direction: column; justify-content: center; }
  .wordmark { font-size: 52px; font-weight: 650; letter-spacing: -2px; margin-bottom: 44px; }
  h1 { font-size: 150px; font-weight: 550; line-height: 1.02; letter-spacing: -6.5px; margin: 0 0 40px; }
  .sub { font-size: 54px; font-weight: 450; letter-spacing: -1px; color: #60646c; margin: 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">dhruvg.</div>
    <h1>Hi, I’m Dhruv.</h1>
    <p class="sub">Writing · Projects · About</p>
  </div>
</body>
</html>
