<!doctype html>
<!-- Source for public/social-card.png (1200x630 link-preview image). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=public/social-card.png scripts/social-card.html -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #202124; font-synthesis: none; -webkit-font-smoothing: antialiased; }
  .card { box-sizing: border-box; height: 630px; padding: 0 84px; display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 50px 0 34px; border-bottom: 1px solid #e5e7eb; }
  .wordmark { font-size: 38px; font-weight: 650; letter-spacing: -1.6px; }
  nav { display: flex; gap: 40px; font-size: 22px; color: #60646c; }
  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 20px; }
  h1 { font-size: 96px; font-weight: 550; line-height: 1.1; letter-spacing: -4px; margin: 0 0 30px; }
  .intro { font-size: 34px; line-height: 1.5; color: #40444c; margin: 0; max-width: 960px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="wordmark">dhruvg.</span>
      <nav><span>Writing</span><span>Projects</span><span>About</span></nav>
    </div>
    <div class="hero">
      <h1>Hi, I’m Dhruv.</h1>
      <p class="intro">I’m a product leader passionate about AI, product strategy, and building tools that empower everyone.</p>
    </div>
  </div>
</body>
</html>
