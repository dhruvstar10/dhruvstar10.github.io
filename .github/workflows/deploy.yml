name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require the dependency lockfile
        run: test -f package-lock.json
      - uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm
          build-cmd: npm run check && npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://dhruvstar10.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
